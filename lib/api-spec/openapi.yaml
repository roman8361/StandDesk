openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for School Desk Manager
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: classes
  - name: students
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Проверка состояния
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Вход в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Неверные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Выход из системы
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Текущий пользователь
      responses:
        "200":
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: Список классов
      responses:
        "200":
          description: Список классов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolClass"
    post:
      operationId: createClass
      tags: [classes]
      summary: Создать класс
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassBody"
      responses:
        "201":
          description: Класс создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolClass"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Получить класс
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Класс
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolClass"
        "404":
          description: Не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Обновить класс
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassBody"
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolClass"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Удалить класс
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Удалено

  /classes/{id}/students:
    get:
      operationId: listStudents
      tags: [students]
      summary: Список учеников в классе
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Список учеников
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Добавить ученика
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Ученик создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Получить ученика
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ученик
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Обновить ученика
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentBody"
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Удалить ученика
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Удалено

  /admin/teachers:
    get:
      operationId: listTeachers
      tags: [admin]
      summary: Все учителя (только админ)
      responses:
        "200":
          description: Список учителей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Статистика (только админ)
      responses:
        "200":
          description: Статистика
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [teacher, admin]
        createdAt:
          type: string
          format: date-time
      required: [id, username, name, email, role, createdAt]

    SchoolClass:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        studentCount:
          type: integer
        teacherId:
          type: integer
        teacherName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, studentCount, teacherId, createdAt, updatedAt]

    Student:
      type: object
      properties:
        id:
          type: integer
        classId:
          type: integer
        fullName:
          type: string
        age:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        vision:
          type: ["string", "null"]
        weight:
          type: ["integer", "null"]
      required: [id, classId, fullName]

    CreateClassBody:
      type: object
      properties:
        name:
          type: string
        studentCount:
          type: integer
      required: [name, studentCount]

    UpdateClassBody:
      type: object
      properties:
        name:
          type: string
        studentCount:
          type: integer

    CreateStudentBody:
      type: object
      properties:
        fullName:
          type: string
        age:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        vision:
          type: ["string", "null"]
        weight:
          type: ["integer", "null"]
      required: [fullName]

    UpdateStudentBody:
      type: object
      properties:
        fullName:
          type: string
        age:
          type: ["integer", "null"]
        height:
          type: ["integer", "null"]
        vision:
          type: ["string", "null"]
        weight:
          type: ["integer", "null"]

    AdminStats:
      type: object
      properties:
        totalTeachers:
          type: integer
        totalClasses:
          type: integer
        totalStudents:
          type: integer
      required: [totalTeachers, totalClasses, totalStudents]
