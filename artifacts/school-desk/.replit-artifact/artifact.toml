kind = "web"
previewPath = "/"
title = "School Desk Manager"
version = "1.0.0"
id = "artifacts/school-desk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18785

[services.development]
run = "pnpm --filter @workspace/school-desk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/school-desk", "run", "build" ]
publicDir = "artifacts/school-desk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18785"
BASE_PATH = "/"
